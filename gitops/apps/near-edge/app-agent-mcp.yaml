---
# ArgoCD Application — Agent & MCP Servers (near-edge)
# Manages: ContentIntelligenceAgent (LangGraph), all 6 MCP servers
# Auto-sync: agent code changes flow through Git → build → deploy
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mec-agent-mcp
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: mec-content-ai
    tier: agent
spec:
  project: mec-content-ai
  source:
    repoURL: https://github.com/<YOUR_ORG>/5g-mec-ai.git
    targetRevision: main
    path: implementation/phase-05-agent-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: mec-content-ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
