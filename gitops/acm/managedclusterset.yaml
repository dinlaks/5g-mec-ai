---
# ManagedClusterSet — near-edge
# Clusters join by labeling the ManagedCluster with:
#   cluster.open-cluster-management.io/clusterset: near-edge-clusters
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: near-edge-clusters
spec:
  clusterSelector:
    selectorType: ExclusiveClusterSetLabel
---
# ManagedClusterSet — far-edge
# Clusters join by labeling the ManagedCluster with:
#   cluster.open-cluster-management.io/clusterset: far-edge-mec-clusters
apiVersion: cluster.open-cluster-management.io/v1beta2
kind: ManagedClusterSet
metadata:
  name: far-edge-mec-clusters
spec:
  clusterSelector:
    selectorType: ExclusiveClusterSetLabel
