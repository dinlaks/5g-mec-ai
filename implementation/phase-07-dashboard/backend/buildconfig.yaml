---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: edgestream-iq-backend
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/name: edgestream-iq-backend
    app.kubernetes.io/part-of: mec-content-ai
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: edgestream-iq-backend
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/name: edgestream-iq-backend
    app.kubernetes.io/part-of: mec-content-ai
spec:
  source:
    type: Git
    git:
      uri: "${GIT_REPO_URL}"
      ref: main
    contextDir: implementation/phase-07-dashboard/backend
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: edgestream-iq-backend:latest
  triggers:
    - type: ConfigChange
