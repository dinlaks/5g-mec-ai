---
# CDN Mock — Seed Job
# Downloads Big Buck Bunny HLS segments from public Mux test stream
# into the cdn-mock PVC so cdn-mock serves them locally (Option 1 + Option 3)
#
# Run once before demo:
#   oc apply -f cdn-mock-seed-job.yaml -n mec-content-ai
#   oc wait job/cdn-mock-seed --for=condition=Complete --timeout=600s -n mec-content-ai
#   oc logs job/cdn-mock-seed -n mec-content-ai
#
# After seeding: /nfl-game/ segments are served locally (no internet needed during demo)
# If seeding fails or is skipped: Nginx proxies to public Mux CDN as fallback
#
# Production note: replace with CDN peering integration — no seed job needed
apiVersion: batch/v1
kind: Job
metadata:
  name: cdn-mock-seed
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/name: cdn-mock
    app.kubernetes.io/part-of: mec-content-ai
    mec.component: demo
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cdn-mock-seed
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: registry.access.redhat.com/ubi9/ubi-minimal:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              microdnf install -y wget curl --nodocs --setopt=install_weak_deps=0

              BASE_URL="https://test-streams.mux.dev/x36xhzz"
              OUT_DIR="/cdn-data/nfl-game"
              mkdir -p "${OUT_DIR}"

              echo "=== CDN Mock Seed — Big Buck Bunny HLS ==="
              echo "Source: ${BASE_URL}"
              echo "Target: ${OUT_DIR}"

              # Download master playlist
              echo "[1/4] Downloading master playlist..."
              curl -sSf "${BASE_URL}/x36xhzz.m3u8" -o "${OUT_DIR}/manifest.m3u8"
              echo "      ✅ manifest.m3u8"

              # Download quality renditions (first 50 segments each ≈ 10 mins)
              for QUALITY in 360p 720p 1080p; do
                case $QUALITY in
                  360p)  PLAYLIST_PATH="url_0/193039199_mp4_h264_aac_hd_7.m3u8" ;;
                  720p)  PLAYLIST_PATH="url_2/193039199_mp4_h264_aac_hd_7.m3u8" ;;
                  1080p) PLAYLIST_PATH="url_4/193039199_mp4_h264_aac_hd_7.m3u8" ;;
                esac

                QUALITY_DIR="${OUT_DIR}/${QUALITY}"
                mkdir -p "${QUALITY_DIR}"

                echo "[2/4] ${QUALITY}: downloading playlist..."
                curl -sSf "${BASE_URL}/${PLAYLIST_PATH}" \
                  -o "${QUALITY_DIR}/playlist.m3u8" 2>/dev/null || {
                  echo "      ⚠️  ${QUALITY} playlist unavailable — fallback proxy will handle"
                  continue
                }

                COUNT=0
                MAX=50
                while IFS= read -r line; do
                  [[ "$line" == \#* ]] && continue
                  [[ -z "$line" ]] && continue
                  [ $COUNT -ge $MAX ] && break

                  SEGMENT=$(basename "$line")
                  SEGMENT_URL="${BASE_URL}/${SEGMENT}"
                  OUT_PATH="${QUALITY_DIR}/${SEGMENT}"

                  [ -f "${OUT_PATH}" ] && { COUNT=$((COUNT+1)); continue; }

                  curl -sSf --retry 2 --retry-delay 1 \
                    "${SEGMENT_URL}" -o "${OUT_PATH}" 2>/dev/null || true
                  COUNT=$((COUNT+1))
                  [ $((COUNT % 10)) -eq 0 ] && echo "      ${QUALITY}: ${COUNT}/${MAX} segments..."
                done < "${QUALITY_DIR}/playlist.m3u8"

                SIZE=$(du -sh "${QUALITY_DIR}" 2>/dev/null | cut -f1)
                echo "      ✅ ${QUALITY}: ${COUNT} segments, ${SIZE}"
              done

              # Write seed manifest
              echo "[3/4] Writing seed manifest..."
              cat > "${OUT_DIR}/.seed-manifest.json" << EOF
              {
                "content_id": "nfl-game",
                "source": "${BASE_URL}",
                "description": "Big Buck Bunny (Mux public test stream) — stand-in for NFL game",
                "seeded_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
                "quality_tiers": ["360p", "720p", "1080p"],
                "total_size": "$(du -sh ${OUT_DIR} 2>/dev/null | cut -f1)"
              }
              EOF

              echo "[4/4] Seed complete!"
              echo "      Total: $(du -sh ${OUT_DIR} | cut -f1)"
              echo ""
              echo "CDN mock ready at: http://cdn-mock.mec-content-ai.svc.cluster.local:8080/nfl-game/"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cdn-data
              mountPath: /cdn-data
      volumes:
        - name: cdn-data
          persistentVolumeClaim:
            claimName: cdn-mock-pvc
