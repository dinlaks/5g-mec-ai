---
# Granite 3.3 8B InferenceService
# Namespace: mec-content-ai (RHOAI 3.3 — redhat-ods-applications is protected)
# Serves: strategy reasoning (LangGraph) + Ansible playbook generation (Lightspeed)
# Single model architecture — both purposes on one A10G GPU.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: granite-3-3-8b
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/part-of: mec-content-ai
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    opendatahub.io/hardware-profile-name: nvidia-a10g-gpu
spec:
  predictor:
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nodeSelector:
      nvidia.com/gpu.present: "true"
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-cuda-runtime
      storageUri: "oci://quay.io/redhat-ai-services/modelcar-catalog:granite-3.3-8b-instruct"
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
