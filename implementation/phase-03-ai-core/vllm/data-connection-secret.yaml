---
# RHOAI Data Connection — MinIO S3 for model storage
# Namespace: mec-content-ai (RHOAI 3.3: InferenceService runs in user namespace)
# This Secret tells KServe/vLLM where to pull model weights from (MinIO)
# RHOAI recognises the aws-connection-* label pattern for data connections
#
# ⚠️  TEMPLATE — do not apply directly with these placeholder values
#     Apply via: ./scripts/apply-secrets.sh (reads from env.sh)
#     Or apply manually after sourcing env.sh:
#
#     oc create secret generic aws-connection-mec-models \
#       -n mec-content-ai \
#       --from-literal=AWS_ACCESS_KEY_ID=$MINIO_ACCESS_KEY \
#       --from-literal=AWS_SECRET_ACCESS_KEY=$MINIO_SECRET_KEY \
#       --from-literal=AWS_S3_ENDPOINT=http://minio.mec-ai-data.svc.cluster.local:9000 \
#       --from-literal=AWS_DEFAULT_REGION=us-east-1 \
#       --from-literal=AWS_S3_BUCKET=mec-models \
#       --from-literal=AWS_S3_USE_PATH_STYLE=true
apiVersion: v1
kind: Secret
metadata:
  name: aws-connection-mec-models
  namespace: mec-content-ai
  labels:
    opendatahub.io/managed: "true"
    opendatahub.io/dashboard: "true"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_MINIO_ACCESS_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_MINIO_SECRET_KEY"
  AWS_S3_ENDPOINT: "http://minio.mec-ai-data.svc.cluster.local:9000"
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_S3_BUCKET: "mec-models"
  AWS_S3_USE_PATH_STYLE: "true"
