---
# vLLM ServingRuntime — RHOAI 3.3
# Namespace: mec-content-ai
# Model: Granite 3.3 8B Instruct — used for BOTH strategy reasoning AND Ansible Lightspeed
# Single model architecture: one GPU, one model, two purposes.
# Display name matches RHOAI template exactly so dashboard shows correctly.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-cuda-runtime
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/part-of: mec-content-ai
  annotations:
    openshift.io/display-name: "vLLM NVIDIA GPU ServingRuntime for KServe"
    opendatahub.io/display-name: "vLLM NVIDIA GPU ServingRuntime for KServe"
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/runtime-version: "v0.13.0"
    opendatahub.io/template-name: "vLLM NVIDIA GPU ServingRuntime for KServe"
    opendatahub.io/template-namespace: "redhat-ods-applications"
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaiis/vllm-cuda-rhel9:3.2.4
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--dtype=half"
        - "--max-model-len=8192"
        - "--gpu-memory-utilization=0.90"
        - "--enable-chunked-prefill"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
      ports:
        - containerPort: 8080
          protocol: TCP
          name: http
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 120
        periodSeconds: 20
        failureThreshold: 6
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 12Gi
