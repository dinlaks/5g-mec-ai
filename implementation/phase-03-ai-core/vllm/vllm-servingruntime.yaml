---
# vLLM ServingRuntime — RHOAI 3.3
# Namespace: redhat-ods-applications
# Defines how KServe launches vLLM to serve Llama 3.1 8B Instruct
# RHOAI 3.3 ships with a built-in vLLM runtime, but we define our own
# for explicit version control and custom args (tensor parallelism, quantization)
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: vllm-runtime-mec
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: mec-content-ai
  annotations:
    openshift.io/display-name: "vLLM Runtime — MEC Content Intelligence"
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  annotations:
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      version: "1"
      autoSelect: true
  containers:
    - name: kserve-container
      image: quay.io/modh/vllm:rhoai-2.16-cuda     # RHOAI 3.3 vLLM image
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - "--port=8080"
        - "--model=/mnt/models"
        - "--served-model-name={{.Name}}"
        - "--max-model-len=8192"
        - "--dtype=bfloat16"
        # Quantization — use AWQ for A10G (24GB VRAM), remove for L40S (48GB VRAM)
        - "--quantization=awq"
        # Tensor parallelism — 1 GPU. Set to 2 if using 2 GPUs
        - "--tensor-parallel-size=1"
        - "--gpu-memory-utilization=0.90"
        - "--enable-chunked-prefill"
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
      ports:
        - containerPort: 8080
          protocol: TCP
          name: http
      resources:
        requests:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 32Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 10
        failureThreshold: 30
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 120
        periodSeconds: 20
        failureThreshold: 6
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 12Gi
    - name: tmp
      emptyDir: {}
