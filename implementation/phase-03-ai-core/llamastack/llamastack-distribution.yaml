apiVersion: llamastack.io/v1alpha1
kind: LlamaStackDistribution
metadata:
  name: mec-llamastack
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/part-of: mec-content-ai
spec:
  replicas: 1
  network:
    exposeRoute: true
  server:
    workers: 1
    distribution:
      name: "rh-dev"
    containerSpec:
      name: llamastack
      port: 8321
      env:
        - name: POSTGRES_HOST
          value: "postgresql.mec-ai-obs.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "llamastack"
        - name: POSTGRES_USER
          value: "langfuse"
        - name: POSTGRES_PASSWORD
          value: "${PG_PASSWORD}"
        - name: VLLM_URL
          value: "${VLLM_INFERENCE_URL}"
        - name: VLLM_API_TOKEN
          value: "fake"
        - name: VLLM_EMBEDDING_URL
          value: "${VLLM_INFERENCE_URL}"
        - name: VLLM_EMBEDDING_API_TOKEN
          value: "fake"
        - name: INFERENCE_MODEL
          value: "granite-3-3-8b"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "${LANGFUSE_HOST}/api/otlp/v1/traces"
        - name: OTEL_SERVICE_NAME
          value: "mec-llamastack"
        - name: SSL_VERIFY
          value: "false"
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
