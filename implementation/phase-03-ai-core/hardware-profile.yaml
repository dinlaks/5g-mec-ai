apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: nvidia-a10g-gpu
  namespace: redhat-ods-applications
  labels:
    app.kubernetes.io/part-of: mec-content-ai
  annotations:
    opendatahub.io/display-name: "NVIDIA A10G GPU (g5.2xlarge)"
    opendatahub.io/description: "24GB VRAM A10G — Granite 3.3 8B Instruct inference via vLLM"
spec:
  displayName: "NVIDIA A10G (24GB)"
  enabled: true
  identifiers:
    - displayName: "NVIDIA GPU"
      identifier: nvidia.com/gpu
      minCount: 1
      maxCount: 1
      defaultCount: 1
    - displayName: "CPU"
      identifier: cpu
      minCount: 4
      maxCount: 8
      defaultCount: 4
    - displayName: "Memory"
      identifier: memory
      minCount: 16Gi
      maxCount: 32Gi
      defaultCount: 16Gi
  scheduling:
    type: Node
    node:
      nodeSelector:
        node-role.kubernetes.io/gpu-worker: ""
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
