# DSCInitialization — applied AFTER RHOAI operator CSV reaches Succeeded
# Required in RHOAI 3.x before DataScienceCluster can be created
apiVersion: dscinitialization.opendatahub.io/v1
kind: DSCInitialization
metadata:
  name: default-dsci
spec:
  applicationsNamespace: redhat-ods-applications
  monitoring:
    managementState: Managed
    namespace: redhat-ods-monitoring
  trustedCABundle:
    customCABundle: ""
    managementState: Managed
  serviceMesh:
    managementState: Removed   # OSSM 3.x (Sail Operator) manages this independently
