---
# Wave 1 — Red Hat Advanced Cluster Management (ACM) 2.15 Operator
# Manages: near-edge hub governs all far-edge MEC clusters
# ACM GitOpsCluster links ACM Placement → ArgoCD (gitops/ folder)
apiVersion: v1
kind: Namespace
metadata:
  name: open-cluster-management
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: open-cluster-management
  namespace: open-cluster-management
spec:
  targetNamespaces:
    - open-cluster-management
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: advanced-cluster-management
  namespace: open-cluster-management
spec:
  channel: release-2.15
  installPlanApproval: Automatic
  name: advanced-cluster-management
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# MultiClusterHub — ACM control plane
# Enables: cluster management, application lifecycle, GitOps integration, policy engine
apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
spec:
  availabilityConfig: Basic    # use High for production multi-replica
  disableHubSelfManagement: false
  overrides:
    components:
      - name: app-lifecycle
        enabled: true
      - name: cluster-lifecycle
        enabled: true
      - name: grc
        enabled: true          # governance / policy engine
      - name: multicluster-engine
        enabled: true
