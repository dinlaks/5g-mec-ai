---
# Wave 1 — Red Hat OpenShift AI (RHOAI) 3.x latest stable
# Requires: cert-manager (wave 0), Service Mesh 3.x, Serverless already running
# Installs: RHOAI operator which manages vLLM, KServe, Kubeflow Pipelines, MLflow
apiVersion: v1
kind: Namespace
metadata:
  name: redhat-ods-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: redhat-ods-operator
  namespace: redhat-ods-operator
spec: {}   # AllNamespaces mode — required by RHOAI 3.x
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: redhat-ods-operator
spec:
  channel: stable-3.x
  installPlanApproval: Automatic
  name: rhods-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
