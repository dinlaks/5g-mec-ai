---
# Wave 0 — NVIDIA GPU Operator
# Requires: NFD already running and labelling nodes
# Installs GPU drivers, device plugin, and monitoring on GPU nodes
# Near-edge cluster needs GPU for vLLM (Llama 3.1 8B Instruct)
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator
  labels:
    openshift.io/cluster-monitoring: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: gpu-operator
  namespace: gpu-operator
spec:
  targetNamespaces:
    - gpu-operator
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: gpu-operator-certified
  namespace: gpu-operator
spec:
  channel: v24.9
  installPlanApproval: Automatic
  name: gpu-operator-certified
  source: certified-operators
  sourceNamespace: openshift-marketplace
