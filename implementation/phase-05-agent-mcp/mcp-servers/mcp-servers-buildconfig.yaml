---
# MCP Servers — ImageStreams + BuildConfigs (all 6)
# Each MCP server gets its own ImageStream and BuildConfig.
# Builds from Git → internal OpenShift registry → referenced by mcp-servers-deployment.yaml
#
# Apply order:
#   1. oc apply -f mcp-servers-buildconfig.yaml   (creates ImageStreams + BuildConfigs)
#   2. oc start-build mcp-<name> -n mec-content-ai (trigger each build)
#   OR set triggers in BuildConfig to auto-build on ConfigChange (default below)

# ─────────────────────────────────────────────────────────────────────────────
# 1. mcp-network-intel
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: mcp-network-intel
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/name: mcp-network-intel
    app.kubernetes.io/part-of: mec-content-ai

---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: mcp-network-intel
  namespace: mec-content-ai
  labels:
    app.kubernetes.io/name: mcp-network-intel
    app.kubernetes.io/part-of: mec-content-ai
spec:
  source:
    type: Git
    git:
      uri: "${GIT_REPO_URL}"
      ref: main
    contextDir: implementation/phase-05-agent-mcp/mcp-servers/mcp-network-intel
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: mcp-network-intel:latest
  triggers:
    - type: ConfigChange

