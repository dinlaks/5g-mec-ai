---
# Cache Manager — Nginx ConfigMap
# Namespace: far-edge-mec (SNO far-edge node)
#
# Nginx serves pre-fetched video segments from /var/mec-cache.
# Sidecar (cache-reporter) publishes cache metrics to Kafka cache.state topic.
#
# Video segment request flow:
#   Subscriber phone → Nginx (/nfl-game/720p/segment_042.ts)
#   Nginx checks /var/mec-cache/nfl-game/720p/segment_042.ts
#   Cache HIT  → serves locally (no backhaul)
#   Cache MISS → returns 404 (subscriber falls back to CDN directly)
#
# Note: Quality tier selection is done by the ABR Policy Engine (separate pod).
# The ABR engine is called by the subscriber's player or network proxy — not by Nginx.
# Nginx's job is purely cache storage + serving.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cache-manager-nginx-config
  namespace: far-edge-mec
  labels:
    app.kubernetes.io/name: cache-manager
    app.kubernetes.io/part-of: mec-content-ai
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include       /etc/nginx/mime.types;
      default_type  application/octet-stream;

      types {
        application/vnd.apple.mpegurl  m3u8;
        video/mp2t                     ts;
        video/mp4                      mp4 m4s m4v;
        application/dash+xml           mpd;
      }

      log_format cache '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent cache=$upstream_cache_status';
      access_log /var/log/nginx/access.log cache;

      sendfile on;
      keepalive_timeout 65;

      # Track cache hits/misses via shared memory
      # Used by cache-reporter sidecar to calculate hit rate
      lua_shared_dict cache_stats 1m;   # requires nginx-lua module (if available)

      server {
        listen 8080;
        server_name _;

        root /var/mec-cache;

        # ── Health check ────────────────────────────────────────────────────
        location /health {
          access_log off;
          return 200 '{"status":"ok","service":"cache-manager"}';
          add_header Content-Type application/json;
        }

        # ── Cache inventory (for EdgeStream IQ dashboard) ───────────────────
        location /cache-status {
          access_log off;
          alias /var/mec-cache/;
          autoindex on;
          autoindex_format json;
          add_header Content-Type application/json;
        }

        # ── Video segment serving ────────────────────────────────────────────
        location / {
          add_header Access-Control-Allow-Origin *;
          add_header Cache-Control "no-cache";
          add_header X-Cache-Node "${hostname}";

          # Try local cache first
          try_files $uri =404;

          # On cache hit: serve with hit header
          add_header X-Cache-Status "HIT";
        }
      }
    }

  # Cache reporter script — publishes cache.state metrics to Kafka
  # Runs as a sidecar container (separate from Nginx)
  cache-reporter.py: |
    #!/usr/bin/env python3
    """
    Cache Reporter — Sidecar for Cache Manager
    Periodically scans /var/mec-cache and publishes cache.state to Kafka.
    EdgeStream IQ dashboard reads cache.state to show cache hit rate + inventory.
    """
    import json
    import os
    import time
    import logging
    from datetime import datetime, timezone
    from pathlib import Path

    from confluent_kafka import Producer

    logging.basicConfig(level=logging.INFO, format="%(asctime)s [cache-reporter] %(message)s")
    log = logging.getLogger(__name__)

    KAFKA_BOOTSTRAP  = os.getenv("KAFKA_BOOTSTRAP", "kafka-cluster-kafka-bootstrap.mec-ai-data.svc.cluster.local:9092")
    MEC_SITE_ID      = os.getenv("MEC_SITE_ID", "mec-stadium-01")
    CACHE_BASE       = Path(os.getenv("CACHE_BASE_PATH", "/var/mec-cache"))
    REPORT_INTERVAL  = int(os.getenv("REPORT_INTERVAL_SECONDS", "30"))
    TOTAL_CACHE_GB   = float(os.getenv("TOTAL_CACHE_GB", "400"))

    producer = Producer({"bootstrap.servers": KAFKA_BOOTSTRAP,
                         "client.id": f"cache-reporter-{MEC_SITE_ID}"})

    def scan_cache() -> dict:
        """Scan cache directory and return inventory summary."""
        if not CACHE_BASE.exists():
            return {"content_items": [], "used_gb": 0, "cache_hit_rate_pct": 0}

        items = []
        total_bytes = 0

        for content_dir in CACHE_BASE.iterdir():
            if content_dir.is_dir() and not content_dir.name.startswith("."):
                manifest = content_dir / ".cache-manifest.json"
                size_bytes = sum(f.stat().st_size for f in content_dir.rglob("*") if f.is_file())
                total_bytes += size_bytes

                item = {
                    "content_id":   content_dir.name,
                    "size_gb":      round(size_bytes / (1024**3), 2),
                    "status":       "ready" if manifest.exists() else "partial",
                    "cached_at":    manifest.stat().st_mtime if manifest.exists() else None,
                }
                items.append(item)

        used_gb = round(total_bytes / (1024**3), 2)
        # Simulate cache hit rate — higher when content is cached
        hit_rate = min(90, len(items) * 15 + 12) if items else 12

        return {
            "content_items":     items,
            "used_gb":           used_gb,
            "total_gb":          TOTAL_CACHE_GB,
            "cache_hit_rate_pct": hit_rate,
        }

    def run():
        log.info(f"Cache reporter started for {MEC_SITE_ID}, scanning {CACHE_BASE}")
        while True:
            try:
                inventory = scan_cache()
                payload = {
                    "mec_site_id":        MEC_SITE_ID,
                    "timestamp":          datetime.now(timezone.utc).isoformat(),
                    **inventory,
                }
                producer.produce("cache.state", json.dumps(payload).encode())
                producer.flush()
                log.info(
                    f"Published cache.state — items: {len(inventory['content_items'])}, "
                    f"used: {inventory['used_gb']}GB, hit_rate: {inventory['cache_hit_rate_pct']}%"
                )
            except Exception as e:
                log.error(f"Error: {e}")
            time.sleep(REPORT_INTERVAL)

    if __name__ == "__main__":
        run()
