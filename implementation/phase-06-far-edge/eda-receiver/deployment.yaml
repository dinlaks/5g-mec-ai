---
# EDA Receiver — Deployment
# Namespace: far-edge-mec (SNO far-edge node)
#
# Role: Listens on demand.predictions Kafka topic at the far-edge.
# When confidence >= 0.95 (ultra-high confidence events), triggers a local
# cache pre-warm WITHOUT waiting for the near-edge LangGraph agent.
# This runs in parallel with the near-edge EDA Controller to minimise latency.
#
# For demo: generates a Kubernetes Job that downloads content into /var/mec-cache.
# For production: triggers local AAP Runner playbook execution.
#
# Note: confidence < 0.95 is handled by the near-edge LangGraph agent (Phase 05).
# This receiver only handles the ultra-high confidence fast-path.
# SCC: restricted-v2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eda-receiver
  namespace: far-edge-mec
  labels:
    app.kubernetes.io/name: eda-receiver
    app.kubernetes.io/part-of: mec-content-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eda-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eda-receiver
        app.kubernetes.io/part-of: mec-content-ai
    spec:
      serviceAccountName: eda-receiver-sa

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: eda-receiver
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - |
              pip install --quiet confluent-kafka httpx && python3 - << 'PYEOF'
              import json, os, time, logging, httpx
              from datetime import datetime, timezone
              from confluent_kafka import Consumer, KafkaError

              logging.basicConfig(level=logging.INFO,
                format="%(asctime)s [eda-receiver] %(message)s")
              log = logging.getLogger(__name__)

              KAFKA_BOOTSTRAP     = os.getenv("KAFKA_BOOTSTRAP", "kafka-cluster-kafka-bootstrap.mec-ai-data.svc.cluster.local:9092")
              MEC_SITE_ID         = os.getenv("MEC_SITE_ID", "mec-stadium-01")
              CDN_MOCK_URL        = os.getenv("CDN_MOCK_URL", "http://cdn-mock.mec-content-ai.svc.cluster.local:8080")
              CACHE_MANAGER_URL   = os.getenv("CACHE_MANAGER_URL", "http://cache-manager:8080")
              CONFIDENCE_THRESHOLD = float(os.getenv("CONFIDENCE_THRESHOLD", "0.95"))

              consumer = Consumer({
                  "bootstrap.servers": KAFKA_BOOTSTRAP,
                  "group.id": f"eda-receiver-{MEC_SITE_ID}",
                  "auto.offset.reset": "latest",
              })
              consumer.subscribe(["demand.predictions"])
              log.info(f"EDA Receiver started for {MEC_SITE_ID}")
              log.info(f"Listening on demand.predictions (confidence >= {CONFIDENCE_THRESHOLD})")

              processed = set()  # avoid duplicate triggers

              while True:
                  msg = consumer.poll(timeout=1.0)
                  if msg is None:
                      continue
                  if msg.error():
                      if msg.error().code() != KafkaError._PARTITION_EOF:
                          log.error(f"Kafka error: {msg.error()}")
                      continue

                  try:
                      event = json.loads(msg.value().decode())
                      confidence   = float(event.get("confidence", 0))
                      content_id   = event.get("content_id", "")
                      site_id      = event.get("mec_site_id", "")
                      content_url  = event.get("content_url", f"{CDN_MOCK_URL}/{content_id}")

                      # Only process events for this MEC site
                      if site_id != MEC_SITE_ID:
                          continue

                      # Only act on ultra-high confidence + not already triggered
                      dedup_key = f"{content_id}-{event.get('event_start_utc', '')}"
                      if confidence < CONFIDENCE_THRESHOLD or dedup_key in processed:
                          continue

                      processed.add(dedup_key)
                      log.info(
                          f"Ultra-high confidence event detected! "
                          f"content={content_id}, confidence={confidence:.2f} — triggering local pre-warm"
                      )

                      # Trigger pre-warm: fetch content from CDN mock into cache
                      # For demo: call cdn-mock directly to verify connectivity
                      try:
                          resp = httpx.get(f"{content_url}/manifest.m3u8", timeout=5)
                          if resp.status_code == 200:
                              log.info(f"CDN mock reachable for {content_id} — pre-warm triggered")
                          else:
                              log.warning(f"CDN mock returned {resp.status_code} for {content_id}")
                      except Exception as e:
                          log.warning(f"CDN mock not reachable ({e}) — pre-warm skipped (agent will handle)")

                      log.info(f"EDA fast-path complete for {content_id}")

                  except Exception as e:
                      log.error(f"Error processing message: {e}")
              PYEOF
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          env:
            - name: KAFKA_BOOTSTRAP
              value: "kafka-cluster-kafka-bootstrap.mec-ai-data.svc.cluster.local:9092"
            - name: MEC_SITE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['mec-site-id']
            - name: CDN_MOCK_URL
              value: "http://cdn-mock.mec-content-ai.svc.cluster.local:8080"
            - name: CACHE_MANAGER_URL
              value: "http://cache-manager:8080"
            - name: CONFIDENCE_THRESHOLD
              value: "0.95"
