---
# MinIO — Object Storage for Model Artifacts
# Namespace: mec-ai-data
# Stores: vLLM model weights, KServe LSTM model, Kubeflow pipeline artifacts
# Bucket: mec-models
# Single-node deployment (scale to distributed for production)
# SCC: restricted-v2 — MinIO image supports non-root since v2023+; runs as UID 1000

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: mec-ai-data
  labels:
    app: minio
    app.kubernetes.io/part-of: mec-content-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi     # update to your StorageClass
  resources:
    requests:
      storage: 200Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: mec-ai-data
  labels:
    app: minio
    app.kubernetes.io/part-of: mec-content-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      serviceAccountName: minio-sa

      # ── Pod-level security (restricted-v2 SCC) ────────────────────────────
      # MinIO image (v2023+) supports non-root — runs as UID 1000 (minio user)
      # fsGroup: 1000 ensures PVC mount is writable by the minio group
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10

          # ── Container-level security (restricted-v2 SCC) ──────────────────
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: mec-ai-data
  labels:
    app: minio
    app.kubernetes.io/part-of: mec-content-ai
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001

---
# MinIO console Route (for browser access)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: minio-console
  namespace: mec-ai-data
  labels:
    app: minio
    app.kubernetes.io/part-of: mec-content-ai
spec:
  to:
    kind: Service
    name: minio
  port:
    targetPort: console
  tls:
    termination: edge

---
# MinIO Secret — populated by apply-secrets.sh --phase 02
# Do NOT hardcode credentials here in production.
# This placeholder is overwritten by apply-secrets.sh before deployment.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: mec-ai-data
  labels:
    app.kubernetes.io/part-of: mec-content-ai
type: Opaque
stringData:
  access-key: ""    # set via: export MINIO_ACCESS_KEY=$(openssl rand -hex 8)
  secret-key: ""    # set via: export MINIO_SECRET_KEY=$(openssl rand -hex 16)
