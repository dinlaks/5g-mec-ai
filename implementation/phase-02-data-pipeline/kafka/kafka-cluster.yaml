---
# AMQ Streams 3.1 — Kafka Cluster (KRaft mode, no ZooKeeper)
# Namespace: mec-ai-data
# Uses KafkaNodePool CRs for KRaft — controllers + brokers as separate pools
# External listener (Route) for far-edge MEC nodes to publish telemetry over TLS

# ── CONTROLLER NODE POOL ──────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controller
  namespace: mec-ai-data
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 3
  roles:
    - controller
  storage:
    type: persistent-claim
    size: 10Gi
    deleteClaim: false
    class: gp3-csi        # update to your StorageClass
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: "1"
---
# ── BROKER NODE POOL ─────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: broker
  namespace: mec-ai-data
  labels:
    strimzi.io/cluster: kafka-cluster
spec:
  replicas: 3
  roles:
    - broker
  storage:
    type: persistent-claim
    size: 50Gi
    deleteClaim: false
    class: gp3-csi
  resources:
    requests:
      memory: 2Gi
      cpu: "1"
    limits:
      memory: 4Gi
      cpu: "2"
---
# ── KAFKA CLUSTER ─────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka-cluster
  namespace: mec-ai-data
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    metadataVersion: 3.7-IV4
    listeners:
      # Internal plain — for near-edge services (agent, MCP servers, EDA)
      - name: plain
        port: 9092
        type: internal
        tls: false
      # Internal TLS — for services requiring encrypted comms
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
      # External Route — for far-edge MEC nodes publishing telemetry
      - name: external
        port: 9094
        type: route
        tls: true
        authentication:
          type: tls
    authorization:
      type: simple
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Retention defaults (topics override per-topic)
      log.retention.hours: 24
      log.retention.bytes: 10737418240    # 10 GB per partition
      log.segment.bytes: 1073741824       # 1 GB segments
      # Performance
      num.network.threads: 3
      num.io.threads: 8
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 500m
