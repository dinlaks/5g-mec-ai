---
# Langfuse Secrets — TEMPLATE FILE
# DO NOT commit with real values. Fill in before applying.
# Add configs/near-edge/env.sh values and use envsubst or Sealed Secrets.

# PostgreSQL credentials
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-db-secret
  namespace: mec-ai-obs
  labels:
    app.kubernetes.io/part-of: mec-content-ai
type: Opaque
stringData:
  db-user: langfuse
  db-password: changeme-strong-password     # replace before applying
  database-url: "postgresql://langfuse:changeme-strong-password@postgresql.mec-ai-obs.svc.cluster.local:5432/langfuse"
---
# ClickHouse credentials
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-clickhouse-secret
  namespace: mec-ai-obs
  labels:
    app.kubernetes.io/part-of: mec-content-ai
type: Opaque
stringData:
  user: langfuse
  password: changeme-ch-password           # replace before applying
---
# Langfuse application secrets
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-app-secret
  namespace: mec-ai-obs
  labels:
    app.kubernetes.io/part-of: mec-content-ai
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  nextauth-secret: "changeme-generate-with-openssl-rand-hex-32"
  # Generate with: openssl rand -hex 32
  encryption-key: "changeme-generate-with-openssl-rand-hex-32"
  salt: "changeme-generate-with-openssl-rand-hex-16"
