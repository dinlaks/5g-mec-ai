# Langfuse Helm Values (Chart 1.5.22, App 3.x)
# Mirrors structure from msugur/auto-darknoc reference repo.
# All secrets reference a single 'langfuse-secrets' Kubernetes Secret.
# Apply: helm upgrade --install langfuse langfuse/langfuse -n mec-ai-obs -f langfuse-values.yaml

langfuse:
  image:
    tag: "3.155.1"
    pullPolicy: IfNotPresent

  features:
    telemetryEnabled: false
    signUpDisabled: false

  additionalEnv:
    - name: REDIS_HOST
      value: redis.mec-ai-obs.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"

  web:
    service:
      type: ClusterIP
      port: 3000
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

  worker:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  salt:
    secretKeyRef:
      name: langfuse-secrets
      key: SALT

  encryptionKey:
    secretKeyRef:
      name: langfuse-secrets
      key: ENCRYPTION_KEY

  nextauth:
    # url injected at deploy time via --set langfuse.nextauth.url=...
    secret:
      secretKeyRef:
        name: langfuse-secrets
        key: NEXTAUTH_SECRET

# Disable bundled dependencies — using external deployments
postgresql:
  deploy: false
  host: postgresql.mec-ai-obs.svc.cluster.local
  port: 5432
  auth:
    username: langfuse
    database: langfuse
    existingSecret: langfuse-secrets
    secretKeys:
      userPasswordKey: DATABASE_PASSWORD

redis:
  deploy: false
  host: redis.mec-ai-obs.svc.cluster.local
  port: 6379
  auth:
    username: null
    existingSecret: langfuse-secrets
    existingSecretPasswordKey: REDIS_PASSWORD

clickhouse:
  deploy: false
  host: clickhouse.mec-ai-obs.svc.cluster.local
  httpPort: 8123
  nativePort: 9000
  database: langfuse
  auth:
    username: langfuse
    existingSecret: langfuse-secrets
    existingSecretKey: CLICKHOUSE_PASSWORD
  clusterEnabled: false

s3:
  deploy: false
  storageProvider: s3
  bucket: mec-models
  region: us-east-1
  endpoint: http://minio.mec-ai-data.svc.cluster.local:9000
  forcePathStyle: true
  accessKeyId:
    secretKeyRef:
      name: langfuse-secrets
      key: S3_ACCESS_KEY_ID
  secretAccessKey:
    secretKeyRef:
      name: langfuse-secrets
      key: S3_SECRET_ACCESS_KEY
  mediaUpload:
    enabled: true
    bucket: mec-models
    endpoint: http://minio.mec-ai-data.svc.cluster.local:9000
    region: us-east-1
    forcePathStyle: true
    accessKeyId:
      secretKeyRef:
        name: langfuse-secrets
        key: S3_ACCESS_KEY_ID
    secretAccessKey:
      secretKeyRef:
        name: langfuse-secrets
        key: S3_SECRET_ACCESS_KEY

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 3000
