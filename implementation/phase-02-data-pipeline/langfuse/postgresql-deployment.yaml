---
# PostgreSQL — Langfuse Metadata Store
# Namespace: mec-ai-obs
# Stores: Langfuse projects, API keys, users, prompt versions
# Uses Red Hat UBI-based PostgreSQL image (supported on OCP 4.21)
# SCC: restricted-v2 — image runs as UID 26 (postgres) by default

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-pvc
  namespace: mec-ai-obs
  labels:
    app: postgresql
    app.kubernetes.io/part-of: mec-content-ai
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-csi
  resources:
    requests:
      storage: 20Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  namespace: mec-ai-obs
  labels:
    app: postgresql
    app.kubernetes.io/part-of: mec-content-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      serviceAccountName: postgresql-sa

      # ── Pod-level security (restricted-v2 SCC) ────────────────────────────
      # registry.redhat.io/rhel9/postgresql-15 runs as UID 26 (non-root) by default
      securityContext:
        runAsNonRoot: true
        fsGroup: 26              # matches postgres GID — ensures PVC is writable
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: langfuse-db-secret
                  key: db-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: langfuse-db-secret
                  key: db-password
            - name: POSTGRESQL_DATABASE
              value: langfuse
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - psql -U $POSTGRESQL_USER -d $POSTGRESQL_DATABASE -c "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 10

          # ── Container-level security (restricted-v2 SCC) ──────────────────
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: mec-ai-obs
  labels:
    app: postgresql
    app.kubernetes.io/part-of: mec-content-ai
spec:
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
